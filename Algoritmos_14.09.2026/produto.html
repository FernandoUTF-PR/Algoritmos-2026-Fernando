        function mostrarListaProdutos(listaProdutos) {
            let listagem = "<br>";
            listagem += "<strong>Nome | Preço Unitário </strong><br>";
            listagem += "------------------------------------------------<br>";
            for (let i = 0; i < listaProdutos.length; i++) {
                const linha = listaProdutos[i];
                listagem += linha.nome + " - R$ " + linha.precoUnitario.toFixed(2) +
                    "<br>";
            }
            return listagem;
        }

        function produtoMaisPesado(listaProdutos) {
            let maisPesado = listaProdutos[0].peso;
            let pos = 0;
            for (let i = 1; i < listaProdutos.length; i++) {
                let linha = listaProdutos[i];
                if (linha.peso > maisPesado) {
                    maisPesado = linha.peso;
                    pos = i;
                }
            }
            return "Produto mais pesado: " + listaProdutos[pos].nome + " - " + listaProdutos[pos].peso.toFixed(2) + " kg";
        }

        function produtoMaisLeve(listaProdutos) {
            let maisLeve = listaProdutos[0].peso;
            let pos = 0;
            for (let i = 1; i < listaProdutos.length; i++) {
                let linha = listaProdutos[i];
                if (linha.peso < maisLeve) {
                    maisLeve = linha.peso;
                    pos = i;
                }
            }
            return pos;
        }

        function produtoMaisCaro(listaProdutos) {
            let maisCaro = listaProdutos[0].precoUnitario;
            let pos = 0;
            for (let i = 1; i < listaProdutos.length; i++) {
                let linha = listaProdutos[i];
                if (linha.precoUnitario > maisCaro) {
                    maisCaro = linha.precoUnitario;
                    pos = i;
                }
            }
            return pos;
        }

        function produtoMaisBarato(listaProdutos) {
            let maisBarato = listaProdutos[0].precoUnitario;
            let pos = 0;
            for (let i = 1; i < listaProdutos.length; i++) {
                let linha = listaProdutos[i];
                if (linha.precoUnitario < maisBarato) {
                    maisBarato = linha.precoUnitario;
                    pos = i;
                }
            }
            return pos;
        }

        function mediaDePrecos(listaProdutos) {
            let soma = 0;

            for (let i = 0; i < listaProdutos.length; i++) {
                soma += listaProdutos[i].precoUnitario;
            }

            let mediaPreco = soma / listaProdutos.length;

            return mediaPreco;
        }

        function mediaDePesos(listaProdutos) {
            let somaPeso = 0;

            for (let i = 0; i < listaProdutos.length; i++) {
                somaPeso += listaProdutos[i].peso;
            }

            let mediaPeso = somaPeso / listaProdutos.length;

            return mediaPeso;
        }

        function mostrarprodutoMaisLeve() {
            const posMaisLeve = produtoMaisLeve(listaProdutos);
            document.getElementById("resposta").innerHTML = "Produto mais leve: " + listaProdutos[posMaisLeve].nome + " - " + listaProdutos[posMaisLeve].peso.toFixed(2) + " kg";
        }

        //06
        function mostrarProdutoMaisPesado() {
            document.getElementById("resposta").innerHTML = produtoMaisPesado(listaProdutos);

        }

        function mostrarProdutoMaisCaro() {
            const posMaisCaro = produtoMaisCaro(listaProdutos);
            document.getElementById("resposta").innerHTML = "Produto mais caro: " + listaProdutos[posMaisCaro].nome + " - " + " R$" + listaProdutos[posMaisCaro].precoUnitario.toFixed(2);
        }

        function mostrarProdutoMaisBarato() {
            const posMaisBarato = produtoMaisBarato(listaProdutos);
            document.getElementById("resposta").innerHTML = "Produto mais barato: " + listaProdutos[posMaisBarato].nome + " - " + " R$" + listaProdutos[posMaisBarato].precoUnitario.toFixed(2);
        }

        function mostrarMediaPreco() {
            const mediaPreco = mediaDePrecos(listaProdutos);
            document.getElementById("resposta").innerHTML = "Média: R$" + mediaPreco.toFixed(2);

        }

         function mostrarMediaPeso() {
            const mediaPeso = mediaDePesos(listaProdutos);
            document.getElementById("resposta").innerHTML = "Média: " + mediaPeso.toFixed(2) + " Kg";

        }

        function listarTodosOsProdutos() {
