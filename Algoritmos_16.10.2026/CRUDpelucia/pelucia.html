<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Celular</title>
</head>

<body>

    <h1 style="background-color: rgb(116, 113, 113);">Cadastro de Celular</h1>

    <label for="inputIDpelucia">ID da pelúcia</label>
    <input type="text" name="inputIDpelucia" id="inputIDpelucia">
    <input type="button" value="Procure" id="btProcure" onclick="procure()" style="display:inline;">
    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
    <br><br>

    <label for="inputNome">Nome</label>
    <input type="text" name="inputNome" id="inputNome">
    <br>

    <label for="inputPersonagem">Personagem</label>
    <input type="text" name="inputPersonagem" id="inputPersonagem">
    <br>

    <label for="inputTamanho">Tamanho (em cm)</label>
    <input type="number" name="inputTamanho" id="inputTamanho">
    <br>

    <label for="inputPreco">Preço (em R$)</label>
    <input type="number" name="inputPreco" id="inputPreco">
    <br>
    <br><br>
    <div id="divAviso" style="background-color: antiquewhite;"></div>
    <br>
    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
    <br><br>
    <!-- <input type="button" value="Listar" onclick="listar()">
    <br><br> -->

    <div id="outputSaida" style="background-color: aqua;">...</div>

    <script src="./pelucia.js"></script>
    <script src="./peluciaControle.js"></script>
</body>

</html>
