<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD música</title> 
</head>

<body>

    <h1 style="background-color: rgb(116, 113, 113);">Cadastro de música</h1>

    <label for="inputIDmusica">ID da música</label>
    <input type="text" name="inputIDmusica" id="inputIDmusica">
    <input type="button" value="Procure" id="btProcure" onclick="procure()" style="display:inline;">
    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
    <br><br>

    <label for="inputTitulo">Título</label>
    <input type="text" name="inputTitulo" id="inputTitulo">
    <br>
    

    <label for="inputArtista">Artista</label>
    <input type="text" name="inputArtista" id="inputArtista">
    <br>
    

    <label for="inputDuracao">Duração (em segundos)</label>
    <input type="number" name="inputDuracao" id="inputDuracao">
    <br>

    <label for="inputGenero">Gênero</label>
    <input type="text" name="inputGenero" id="inputGenero">
    <br>
    
    <br><br>
    <div id="divAviso" style="background-color: antiquewhite;"></div>
    <br>
    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
    <br><br>
    <!-- <input type="button" value="Listar" onclick="listar()">
    <br><br> -->

    <div id="outputSaida" style="background-color: aqua;">...</div>

    <script src="./musica.js"></script>
    <script src="./musicaControle.js"></script>
</body>

</html>
